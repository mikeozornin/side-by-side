---
- name: Bootstrap server for Side-by-Side Voting
  hosts: web
  become: true
  vars:
    nginx_site_path: "/etc/nginx/sites-available/{{ domain }}"
    nginx_site_link: "/etc/nginx/sites-enabled/{{ domain }}"
  tasks:
    - name: Update package cache
      apt:
        update_cache: yes

    - name: Install system dependencies for Bun
      apt:
        name:
          - curl
          - wget
          - unzip
          - ca-certificates
          - build-essential
          - git
          - python3-dev
          - libc6-dev
        state: present

    - name: Remove old Node.js packages completely
      apt:
        name:
          - nodejs
          - npm
          - libnode-dev
          - libnode72
          - node-gyp
        state: absent
        purge: yes
      ignore_errors: yes

    - name: Clean up any remaining Node.js files
      shell: |
        rm -rf /usr/include/node
        rm -rf /usr/lib/node_modules
        rm -rf /usr/share/node
        rm -rf /var/lib/nodejs
      args:
        executable: /bin/bash
      ignore_errors: yes

    - name: Clean apt cache after removal
      command: apt-get autoremove -y
      ignore_errors: yes

    - name: Install Bun
      shell: |
        set -e
        echo "🔍 Checking system dependencies..."
        which curl || echo "curl not found"
        which wget || echo "wget not found" 
        which unzip || echo "unzip not found"
        
        echo "⬇️ Downloading and installing Bun..."
        # Try curl first, then wget as fallback
        if command -v curl >/dev/null 2>&1; then
          echo "Using curl..."
          curl -fsSL https://bun.sh/install | bash
        else
          echo "Using wget..."
          wget -qO- https://bun.sh/install | bash
        fi
        
        echo "⏳ Waiting for installation to complete..."
        sleep 5
        
        echo "🔗 Creating symlink..."
        export PATH="$HOME/.bun/bin:$PATH"
        ln -sf /root/.bun/bin/bun /usr/local/bin/bun
        chmod +x /usr/local/bin/bun
        
        echo "✅ Verifying installation..."
        /usr/local/bin/bun --version
        echo "🎉 Bun installation completed successfully!"
      args:
        executable: /bin/bash

    - name: Add Bun to PATH for current session
      shell: |
        echo 'export PATH="$HOME/.bun/bin:$PATH"' >> /root/.bashrc
        source /root/.bashrc
      args:
        executable: /bin/bash

    - name: Check if Bun binary exists
      stat:
        path: /usr/local/bin/bun
      register: bun_binary

    - name: Verify Bun installation
      shell: /usr/local/bin/bun --version
      register: bun_version
      changed_when: false
      when: bun_binary.stat.exists

    - name: Display Bun version
      debug:
        msg: "Bun version: {{ bun_version.stdout }}"
      when: bun_binary.stat.exists

    - name: Ensure bun binary is accessible by www-data
      shell: |
        # Если bun - это симлинк на /root/.bun/bin/bun, копируем файл
        if [ -L /usr/local/bin/bun ] && [ "$(readlink /usr/local/bin/bun)" = "/root/.bun/bin/bun" ]; then
          rm /usr/local/bin/bun
          cp /root/.bun/bin/bun /usr/local/bin/bun
          chmod +x /usr/local/bin/bun
          chown root:root /usr/local/bin/bun
        fi
      args:
        executable: /bin/bash
      when: bun_binary.stat.exists

    - name: Fail if Bun not installed
      fail:
        msg: "Bun installation failed. Please check the installation script."
      when: not bun_binary.stat.exists

    - name: Install PostgreSQL client if needed
      apt:
        name: postgresql-client
        state: present
      when: db_provider == 'postgres'

    - name: Install system dependencies for image optimization
      apt:
        name: "{{ image_optimization_packages }}"
        state: present

    - name: Install Sharp dependencies for HEIC/HEIF conversion
      apt:
        name:
          - libvips-dev          # Core Sharp library
          - libvips42            # VIPS runtime library
          - libglib2.0-dev       # GLib development files (includes GObject)
          - libcairo2-dev        # Cairo graphics library
          - libpango1.0-dev      # Pango text rendering
          - libjpeg-dev          # JPEG support
          - libpng-dev           # PNG support
          - libwebp-dev          # WebP support
          - libtiff-dev          # TIFF support
          - libgif-dev           # GIF support
          - libheif-dev          # HEIC/HEIF support (critical for Sharp)
          - libexif-dev          # EXIF metadata support
          - liblcms2-dev         # Color management
          - liborc-dev           # ORC optimization
          - libfftw3-dev         # FFTW3 for image processing
          - libmagickwand-dev    # ImageMagick development files
        state: present

    - name: Install certbot for Let's Encrypt
      apt:
        name: 
          - certbot
          - python3-certbot-nginx
        state: present

    - name: Ensure base directories exist
      file:
        path: "{{ item }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"
      loop:
        - "{{ release_root }}"
        - "{{ current_link | dirname }}"
        - "{{ nginx_web_root | dirname }}"

    - name: Ensure data and logs directories exist
      file:
        path: "{{ item }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"
      loop:
        - "{{ current_link | dirname }}/data"
        - "{{ current_link | dirname }}/logs"

    - name: Ensure env directory exists
      file:
        path: "{{ env_file_path | dirname }}"
        state: directory
        owner: root
        group: www-data
        mode: "0750"

    - name: Place systemd unit
      copy:
        dest: "/etc/systemd/system/{{ service_name }}.service"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Side-by-Side Voting API
          After=network.target

          [Service]
          WorkingDirectory={{ backend_workdir }}
          ExecStart=/usr/local/bin/bun dist/index.js
          EnvironmentFile={{ env_file_path }}
          Restart=always
          RestartSec=5
          User=www-data
          Group=www-data

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      command: systemctl daemon-reload

    - name: Enable service on boot
      systemd:
        name: "{{ service_name }}"
        enabled: true

    - name: Place nginx site config
      copy:
        dest: "{{ nginx_site_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen 80;
              server_name {{ domain }};

              # Глобальный лимит размера загружаемых файлов (до 10 изображений по 20MB)
              client_max_body_size 300M;

              root {{ nginx_web_root }};
              index index.html;

              # API
              location {{ api_prefix }}/ {
                  # Увеличиваем лимит размера загружаемых файлов до 300MB (до 10 изображений по 20MB)
                  client_max_body_size 300M;
                  
                  proxy_pass http://{{ host_bind }}:{{ server_port }}{{ api_prefix }}/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  # Проксируем Origin и preflight заголовки к backend (CORS управляется приложением)
                  proxy_set_header Origin $http_origin;
                  proxy_set_header Access-Control-Request-Method $http_access_control_request_method;
                  proxy_set_header Access-Control-Request-Headers $http_access_control_request_headers;

                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 600s;
                  proxy_connect_timeout 60s;
                  proxy_send_timeout 600s;
              }

              # Health check
              location = {{ health_path }} {
                  proxy_pass http://{{ host_bind }}:{{ server_port }}{{ health_path }};
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
              }

              # Cache immutable assets (Vite) - ИСКЛЮЧАЕМ /api/ пути
              location ~* ^(?!\/api\/).*\.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
                  expires 1y;
                  add_header Cache-Control "public, max-age=31536000, immutable";
                  try_files $uri =404;
              }

              # Do not cache index.html
              location = /index.html {
                  add_header Cache-Control "no-cache";
              }

              # SPA fallback - должно быть последним
              location / {
                  try_files $uri /index.html;
              }
          }

    - name: Enable nginx site
      file:
        src: "{{ nginx_site_path }}"
        dest: "{{ nginx_site_link }}"
        state: link

    - name: Test nginx config
      command: nginx -t

    - name: Reload nginx
      service:
        name: nginx
        state: reloaded

    - name: Obtain Let's Encrypt SSL certificate
      command: >
        certbot --nginx 
        -d {{ domain }} 
        --non-interactive 
        --agree-tos 
        --email {{ ssl_email }}
        --redirect
      register: certbot_result
      ignore_errors: yes

    - name: Display SSL certificate status
      debug:
        msg: |
          SSL certificate status:
          {% if certbot_result.rc == 0 %}
          ✅ SSL certificate obtained successfully!
          {% else %}
          ⚠️  SSL certificate not obtained. You may need to:
          1. Ensure domain {{ domain }} points to this server
          2. Run manually: certbot --nginx -d {{ domain }}
          {% endif %}

    - name: Setup automatic SSL certificate renewal
      cron:
        name: "Renew Let's Encrypt SSL certificates"
        job: "0 12 * * * /usr/bin/certbot renew --quiet"
        user: root

    - name: Ensure env file exists with secure perms (placeholder)
      copy:
        dest: "{{ env_file_path }}"
        content: |
          # Конфигурация приложения
          DATA_DIR={{ current_link | dirname }}/data
          LOG_DIR={{ current_link | dirname }}/logs
          DB_PATH={{ current_link | dirname }}/app.db
          PORT={{ server_port }}
          BASE_URL=https://{{ domain }}
          NODE_ENV=production

          # Настройки базы данных
          DB_PROVIDER={{ db_provider }}
          DB_PATH={{ current_link | dirname }}/app.db
          DATABASE_URL={{ database_url }}

          # URL для ссылок на голосования (клиентская часть)
          VOTING_BASE_URL=https://{{ domain }}

          # URL клиентской части (для magic links)
          CLIENT_URL=https://{{ domain }}

          # Режим работы сервера
          # development - для разработки (API на /api, клиент отдельно)
          # production - для продакшна (API на /api, клиент на /)
          SERVER_MODE=production

          # Уведомления в чаты
          # Локализация уведомлений (ru/en)
          NOTIFICATIONS_LOCALE=ru

          # Mattermost интеграция
          MATTERMOST_ENABLED=false
          # MATTERMOST_WEBHOOK_URL=https://your-mattermost-server.com/hooks/your-webhook-id

          # Telegram интеграция (для будущего)
          TELEGRAM_ENABLED=false
          # TELEGRAM_BOT_TOKEN=your-bot-token
          # TELEGRAM_CHAT_ID=your-chat-id

          # Web Push уведомления
          WEB_PUSH_ENABLED={{ web_push_enabled | lower }}
          # Сгенерируйте ключи командой: npx web-push generate-vapid-keys
          VAPID_PUBLIC_KEY={{ vapid_public_key }}
          VAPID_PRIVATE_KEY={{ vapid_private_key }}
          VAPID_EMAIL={{ vapid_email }}

          # Rate Limiting
          # Максимальное количество созданий голосований за минуту с одного IP
          RATE_LIMIT_VOTING_PER_MINUTE=6
          # Максимальное количество созданий голосований за час с одного IP
          RATE_LIMIT_VOTING_PER_HOUR=60
          # Максимальное количество запросов magic link за минуту с одного IP
          RATE_LIMIT_AUTH_MAGIC_LINK_PER_MINUTE=5
          # Максимальное количество попыток верификации токена за минуту с одного IP
          RATE_LIMIT_AUTH_VERIFY_TOKEN_PER_MINUTE=5

          # JWT секретный ключ для подписи токенов
          # В продакшене ОБЯЗАТЕЛЬНО используйте сложный случайный ключ!
          JWT_SECRET=CHANGE_ME_IN_PRODUCTION_USE_STRONG_RANDOM_KEY

          # Режим аутентификации
          # anonymous - анонимный доступ (кто угодно может создавать и голосовать)
          # magic-links - авторизация через magic links
          AUTH_MODE={{ auth_mode }}

          # Автоапрув сессий в dev режиме (без отправки письма). Не используйте в продакшене!
          # true - автоматически авторизует пользователя без отправки magic link
          # false - отправляет magic link как обычно
          AUTO_APPROVE_SESSIONS=false

          # SMTP настройки для отправки magic link'ов
          # Порт можно не указывать - будет определен автоматически по хосту
          # SMTP_HOST=your-smtp-server.com
          # SMTP_PORT=587  # Опционально: 587 (STARTTLS), 465 (SSL), или 0 для автоопределения
          # SMTP_USER=your-smtp-username
          # SMTP_PASS=your-smtp-password
          # SMTP_FROM_EMAIL=noreply@your-domain.com
        owner: root
        group: www-data
        mode: "0640"
        force: no

    - name: Display next steps
      debug:
        msg: |
          Bootstrap completed! Next steps:
          1. Update /etc/side-by-side/server.env with your real configuration:
             - Generate a strong JWT_SECRET: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
             - Configure SMTP settings for magic links
             - Set up notification webhooks if needed
          2. Run the deploy playbook to deploy your application:
             ansible-playbook -i ansible/inventory.ini ansible/deploy.yml -e restart_service=true
